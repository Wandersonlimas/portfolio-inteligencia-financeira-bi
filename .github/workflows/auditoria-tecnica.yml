name: Auditoria técnica dos dashboards

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Executar testes
        run: python -m unittest discover -s testes -v
      - name: Instalar Chromium para testes de interface
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Testar dashboard no navegador
        run: python testes/smoke_browser.py
